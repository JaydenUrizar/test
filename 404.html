<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emberwild — Multiplayer Survival</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Emberwild: light a fire, claim the wild. A multiplayer survival game that runs in your browser.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 4c4 10 16 16 16 32a16 16 0 0 1-32 0c0-8 4-12 8-16 0 6 3 8 5 8-2-10 0-18 3-24z' fill='%23ff8a3c'/%3E%3Cpath d='M32 30c3 5 8 8 8 14a8 8 0 0 1-16 0c0-4 3-6 5-9 0 3 1 4 3 4z' fill='%23ffd25a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/menus.css">
<link rel="stylesheet" href="css/game.css">
<link rel="stylesheet" href="css/inventory.css">
<link rel="stylesheet" href="css/panels.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three-addons/": "./vendor/three-addons/", "/shared/": "./shared/", "/js/": "./js/" } }
</script>
</head>
<body>
<canvas id="game" tabindex="-1"></canvas>

<!-- menus / screens mount here -->
<div id="screen-root"></div>

<!-- in-game HUD -->
<div id="hud" class="hidden">
  <div id="vignette"></div>
  <div id="hurt-flash"></div>
  <div id="crosshair"><i></i></div>
  <div id="hitmarker"></div>
  <div id="scope" class="hidden"></div>
  <div id="compass"><div id="compass-strip"></div><div id="compass-mark"></div></div>
  <div id="topinfo"></div>
  <div id="minimap-wrap"><canvas id="minimap" width="160" height="160"></canvas><div id="minimap-coords"></div></div>
  <div id="vitals">
    <div class="vit hp"><span class="ico">♥</span><div class="bar"><i></i></div><b></b></div>
    <div class="vit food"><span class="ico">🍖</span><div class="bar"><i></i></div><b></b></div>
    <div class="vit water"><span class="ico">💧</span><div class="bar"><i></i></div><b></b></div>
    <div class="vit temp"><span class="ico">🌡</span><div class="bar"><i></i></div><b></b></div>
    <div class="vit stam"><span class="ico">⚡</span><div class="bar"><i></i></div><b></b></div>
  </div>
  <div id="xpbar"><div class="lvl">1</div><div class="bar"><i></i></div><span></span></div>
  <div id="hotbar"></div>
  <div id="ammo" class="hidden"></div>
  <div id="prompt" class="hidden"></div>
  <div id="progress" class="hidden"><i></i><span></span></div>
  <div id="buildbar" class="hidden"></div>
  <div id="feed"></div>
  <div id="pickups"></div>
  <div id="chat"><div id="chat-log"></div><input id="chat-input" class="input hidden" maxlength="140" placeholder="Say something… (/help for commands)"></div>
  <div id="tutorial" class="hidden"></div>
  <div id="statuses"></div>
  <div id="debug" class="hidden"></div>
  <div id="netwarn" class="hidden"></div>
  <div id="dmg-numbers"></div>
  <div id="emote-wheel" class="hidden"></div>
</div>

<div id="inv-root" class="hidden"></div>
<div id="map-root" class="hidden"></div>
<div id="panel-root" class="hidden"></div>
<div id="overlay-root"></div>
<div id="toast-root"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
